apiVersion: apps/v1
kind: Deployment
metadata:
  name: binarylane-cloud-controller-manager
  namespace: kube-system
  labels:
    app.kubernetes.io/name: binarylane-cloud-controller-manager
    app.kubernetes.io/instance: binarylane-cloud-controller-manager
    app.kubernetes.io/version: '0.2.4'
    app.kubernetes.io/component: cloud-controller-manager
    app.kubernetes.io/part-of: kubernetes
spec:
  replicas: 1 # Adjust the number of replicas as needed
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: binarylane-cloud-controller-manager
      app.kubernetes.io/instance: binarylane-cloud-controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: binarylane-cloud-controller-manager
        app.kubernetes.io/instance: binarylane-cloud-controller-manager
        app.kubernetes.io/version: '0.2.4'
        app.kubernetes.io/component: cloud-controller-manager
        app.kubernetes.io/part-of: kubernetes
    spec:
      dnsPolicy: Default
      hostNetwork: true
      serviceAccountName: binarylane-cloud-controller-manager
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: binarylane-cloud-controller-manager
                  app.kubernetes.io/instance: binarylane-cloud-controller-manager
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
        - effect: NoExecute
          key: node.kubernetes.io/unreachable
          operator: Exists
          tolerationSeconds: 120
        - effect: NoExecute
          key: node.kubernetes.io/not-ready
          operator: Exists
          tolerationSeconds: 120
        - effect: NoSchedule
          key: node.cloudprovider.kubernetes.io/uninitialized
          operator: Exists
        - effect: NoSchedule
          key: node.kubernetes.io/not-ready
          operator: Exists
      nodeSelector:
        node-role.kubernetes.io/control-plane: ''
      containers:
        - name: binarylane-cloud-controller-manager
          image: ghcr.io/oscarhermoso/binarylane-cloud-controller-manager:0.2.4
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          command:
            - /binarylane-cloud-controller-manager
            - --allow-untagged-cloud
            - --cloud-provider=binarylane
            - --leader-elect=true
            - --use-service-account-credentials=true
            - --v=2
          env:
            - name: BINARYLANE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: binarylane-api-token
                  key: api-token
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - mountPath: /etc/kubernetes/
              name: k8s
            - mountPath: /etc/kubernetes/config
              name: cloud-config
      volumes:
        - name: k8s
          hostPath:
            path: /etc/kubernetes
        - name: cloud-config
          hostPath:
            path: /etc/kubernetes/config
